# NeoSkriptDb: SQL from scripts, with skript-db's syntax. The same settings as skript-db's config.yml, plus a few
# of NeoSkriptDb's own (marked). A value that isn't valid is replaced by its default, and the console says which.
# Changes take effect when the server restarts.

# The most connections each database keeps open at once (HikariCP's maximumPoolSize).
pool-size: 10

# Threads that run statements. 0 picks the number of processors plus 2.
thread-pool-size: 0

# How long a connection is kept before it's replaced, in milliseconds. Keep it under the database's own limit
# (MySQL's wait_timeout). 30 minutes.
max-connection-lifetime: 1800000

# How long a statement waits for a free connection before it fails, in milliseconds. At least 250.
connection-timeout: 30000

# How long one statement may run before the database is asked to stop it, in seconds. 0 for no limit.
# NeoSkriptDb: 30 by default (skript-db has no limit). A trigger waits for a statement at most this long, plus
# connection-timeout, plus 5 seconds; with no limit, at most 10 minutes.
query-timeout: 30

# A transaction left without finishing (through 'stop' or 'return' inside its section) is rolled back once it has
# been idle this many seconds.
transaction-timeout: 30

# The JDBC driver for every database. "default" picks it from the URL: mariadb and postgresql use the drivers that
# come with NeoSkriptDb, mysql and sqlite those that come with the server. A script can pick one for a database:
# the database "..." using driver "org.mariadb.jdbc.Driver"
sql-driver-class-name: "default"

# NeoSkriptDb: the most rows a statement may store in a list variable. A result with more fails, with a 'last sql
# error' saying so, rather than running the server out of memory (skript-db reads every row). 0 for no limit.
max-rows: 100000

# NeoSkriptDb: a database nothing has used for this many seconds closes its connections, and opens them again
# when it's next used. Databases a script stops using (say, after a reload changes the URL) don't hold
# connections. 0 to keep them open until the server stops.
idle-close: 600
