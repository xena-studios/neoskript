# NeoSkript configuration

# Send anonymous usage statistics to bStats: https://bstats.org/plugin/bukkit/NeoSkript/34868
# You can also turn bStats off for every plugin in plugins/bStats/config.yml.
metrics: true

variables:
  # Where global variables are saved, in Skript's variables.csv format (Skript can read it too).
  # Relative to plugins/NeoSkript. Variables whose names start with - aren't saved.
  file: variables.csv
  # How often changed variables are saved. They're also saved when the server stops.
  save-interval: 5 minutes
  # Whether players are their UUIDs in variable names ({money::%player%}) or their names, as Skript's
  # 'use player UUIDs in variable names' (on in Skript's default config). Moving over from Skript copies
  # its setting, so the variables it saved are found.
  player-uuids-in-names: true

events:
  # The priority scripts listen to events at: lowest, low, normal, high or highest. As in Skript, the
  # default is high, so scripts see what most other plugins did to an event, and can still cancel it.
  priority: high
  # Whether 'on <event>' triggers also run for events another plugin cancelled.
  listen-to-cancelled: false
