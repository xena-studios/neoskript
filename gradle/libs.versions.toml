[versions]
# The oldest Paper API we support (D6). Code compiles against this, so newer-only API can't slip in.
paper-api = "1.21.4-R0.1-SNAPSHOT"
asm = "9.11.1"
bstats = "3.2.1"
gson = "2.14.0"
junit = "6.1.3"
shadow = "9.6.1"
spotless = "8.10.4"
run-paper = "3.1.0"
# Plugins NeoSkript hooks into (compile-only).
vault-api = "1.7.1"
worldguard = "7.0.12"
worldedit = "7.3.0"
griefprevention = "16.18.4"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault-api" }
worldguard-bukkit = { module = "com.sk89q.worldguard:worldguard-bukkit", version.ref = "worldguard" }
worldguard-core = { module = "com.sk89q.worldguard:worldguard-core", version.ref = "worldguard" }
worldedit-core = { module = "com.sk89q.worldedit:worldedit-core", version.ref = "worldedit" }
worldedit-bukkit = { module = "com.sk89q.worldedit:worldedit-bukkit", version.ref = "worldedit" }
griefprevention = { module = "com.github.TechFortress:GriefPrevention", version.ref = "griefprevention" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
