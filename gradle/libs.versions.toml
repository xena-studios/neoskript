[versions]
# The oldest Paper API we support (D6). Code compiles against this, so newer-only API can't slip in.
paper-api = "1.21.4-R0.1-SNAPSHOT"
asm = "9.11.1"
bstats = "3.2.1"
gson = "2.14.0"
junit = "6.1.3"
shadow = "9.6.1"
teavm = "0.16.0"
spotless = "8.10.4"
run-paper = "3.1.0"
# Publishes the addon API to Maven Central through the Central Portal.
maven-publish = "0.37.0"
# Plugins NeoSkript hooks into (compile-only).
vault-api = "1.7.1"
placeholderapi = "2.12.3"
worldguard = "7.0.12"
worldedit = "7.3.0"
griefprevention = "16.18.4"
# neoskript-db: the pool and the drivers it ships (MySQL and SQLite come with Paper).
hikaricp = "7.1.0"
mariadb-java-client = "3.5.11"
postgresql = "42.7.14"
# Paper's own SQLite driver, for neoskript-db's tests.
sqlite-jdbc = "3.49.1.0"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault-api" }
worldguard-bukkit = { module = "com.sk89q.worldguard:worldguard-bukkit", version.ref = "worldguard" }
worldguard-core = { module = "com.sk89q.worldguard:worldguard-core", version.ref = "worldguard" }
worldedit-core = { module = "com.sk89q.worldedit:worldedit-core", version.ref = "worldedit" }
worldedit-bukkit = { module = "com.sk89q.worldedit:worldedit-bukkit", version.ref = "worldedit" }
griefprevention = { module = "com.github.TechFortress:GriefPrevention", version.ref = "griefprevention" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-java-client" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-paper" }
teavm = { id = "org.teavm", version.ref = "teavm" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
