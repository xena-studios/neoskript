name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The last one listed becomes the default JAVA_HOME. Gradle finds both through JAVA_HOME_*_X64.
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: NeoSkript
          path: neoskript-plugin/build/libs/NeoSkript-*.jar
          if-no-files-found: error

  harness:
    name: Harness (${{ matrix.env }})
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        env: [paper-1.21.4, paper-26.3, folia-1.21.4, folia-26.3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Cache server jars and unpacked servers
        uses: actions/cache@v6
        with:
          path: .harness-cache
          key: harness-${{ matrix.env }}-${{ hashFiles(format('test-harness/environments/{0}.json', matrix.env), 'test-harness/reference-skript.properties') }}
      - run: ./gradlew :test-harness:harness -Pharness.env=${{ matrix.env }} -Pharness.group=smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harness-${{ matrix.env }}
          path: |
            test-harness/build/harness/reports
            test-harness/build/harness/runs/**/harness-console.log
          if-no-files-found: ignore

  # Every push to main that passes the build and all four harness servers is
  # published as the rolling "dev" prerelease: the development build the
  # download page (neoskript.dev/download) offers until real releases exist.
  # The tag moves to each new commit; the jar keeps its version (a SNAPSHOT)
  # and the release notes name the commit.
  dev-build:
    name: Publish development build
    needs: [build, harness]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'xena-studios/neoskript' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: dev-build
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: NeoSkript
          path: dist
      - name: Checksum
        working-directory: dist
        run: sha256sum NeoSkript-*.jar > SHA256SUMS
      - name: Publish the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          notes=$(printf 'Development build of [%s](https://github.com/%s/commit/%s), built %s.\n\nNot a release: for testing on a server you can afford to break. Every push to main that passes CI replaces it.' \
            "$short" "$GH_REPO" "$GITHUB_SHA" "$(date -u +%Y-%m-%d)")
          if gh release view dev >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/dev" -f sha="$GITHUB_SHA" -F force=true
            gh release edit dev --prerelease --title "Development build ($short)" --notes "$notes"
            # Replace the jar: its name only changes with the version.
            for asset in $(gh release view dev --json assets -q '.assets[].name'); do gh release delete-asset dev "$asset" -y; done
          else
            gh release create dev --prerelease --target "$GITHUB_SHA" --title "Development build ($short)" --notes "$notes"
          fi
          gh release upload dev dist/NeoSkript-*.jar dist/SHA256SUMS --clobber
