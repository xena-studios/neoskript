name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # The last one listed becomes the default JAVA_HOME. Gradle finds both through JAVA_HOME_*_X64.
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: NeoSkript
          path: neoskript-plugin/build/libs/NeoSkript-*.jar
          if-no-files-found: error

  harness:
    name: Harness (${{ matrix.env }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [paper-1.21.4, paper-26.3, folia-1.21.4, folia-26.3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache server jars and unpacked servers
        uses: actions/cache@v6
        with:
          path: .harness-cache
          key: harness-${{ matrix.env }}-${{ hashFiles(format('test-harness/environments/{0}.json', matrix.env), 'test-harness/reference-skript.properties') }}
      - run: ./gradlew :test-harness:harness -Pharness.env=${{ matrix.env }} -Pharness.group=smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harness-${{ matrix.env }}
          path: |
            test-harness/build/harness/reports
            test-harness/build/harness/runs/**/harness-console.log
          if-no-files-found: ignore
