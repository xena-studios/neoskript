name: Skript baseline

# Runs the reference Skript's own test suite and the load benchmark, the numbers NeoSkript is measured against.
on:
  push:
    branches: [main]
    paths:
      - test-harness/**
      - .github/workflows/baseline.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        env: [paper-26.3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache server jars and unpacked servers
        uses: actions/cache@v6
        with:
          path: .harness-cache
          key: harness-${{ matrix.env }}-${{ hashFiles(format('test-harness/environments/{0}.json', matrix.env), 'test-harness/reference-skript.properties') }}
      - run: ./gradlew :test-harness:harness -Pharness.env=${{ matrix.env }} -Pharness.group=baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-${{ matrix.env }}
          path: |
            test-harness/build/harness/reports
            test-harness/build/harness/runs/**/harness-console.log
          if-no-files-found: ignore
